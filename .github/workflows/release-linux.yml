# SeekSparks — Linux desktop release build
#
# Builds the native Linux (x64) app on a GitHub-hosted ubuntu-latest
# runner and publishes it as a downloadable release asset. Mirrors
# release-windows.yml step-for-step so the whole release set stays
# consistent.
#
# Triggers
#   * push of a version tag  v*   → build, then attach the tarball to
#     that tag's GitHub Release (creating the release if absent).
#     Normal path: `git tag v1.3.86 && git push origin v1.3.86`.
#   * workflow_dispatch (manual) → always builds + uploads the tarball
#     as a workflow *artifact*. Type an existing tag in the input to
#     also attach it to that release; leave blank for a safe test
#     build that touches no release.
name: Release Linux

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the build to (blank = test build, artifact only, no release touched)'
        required: false
        default: ''

# Needed so the built-in GITHUB_TOKEN can create/upload release assets.
permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Flutter Linux desktop toolchain deps (GTK3 + ninja/clang/cmake).
      # ubuntu-latest already ships a recent libstdc++; these are the
      # pieces `flutter build linux` needs that aren't preinstalled.
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'   # keep in step with flutter-ci.yml
          channel: 'stable'
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build Linux (release)
        run: flutter build linux --release

      - name: Resolve tag
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package tarball
        shell: bash
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          [ -z "$tag" ] && tag="dev-${GITHUB_SHA::7}"
          src="build/linux/x64/release/bundle"
          pkg="SeekSparks-Linux-x64-${tag}.tar.gz"
          # Archive the bundle CONTENTS (so it extracts to ./yswords, lib/, data/)
          tar -czf "$pkg" -C "$src" .
          echo "PKG=$pkg" >> "$GITHUB_ENV"
          echo "Packaged $pkg ($(du -h "$pkg" | cut -f1))"

      - name: Upload workflow artifact (always)
        uses: actions/upload-artifact@v7
        with:
          name: SeekSparks-Linux-x64
          path: ${{ env.PKG }}
          if-no-files-found: error

      - name: Attach to GitHub Release (tag builds only)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          # A release is the only thing the in-app updater reads: it polls
          # releases/latest (lib/services/update_service.dart). A manual run
          # takes an arbitrary ref, and `gh release create` would CREATE the
          # tag on that ref — so a mistyped tag would publish an unreviewed
          # build straight to every reader. Only the tag-push path may cut a
          # release; a manual run attaches to one that already exists.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Release '$tag' does not exist. A manual run only attaches to an existing release; to cut a new one push the tag (tools/tag_release.sh). The build is still available above as a workflow artifact."
              exit 1
            fi
            # create-if-missing; `|| true` guards the race where a
            # sibling platform workflow created it a moment earlier.
            gh release create "$tag" \
              --title "$tag" \
              --notes "Automated Linux x64 build. Download the tarball, extract (\`tar -xzf SeekSparks-Linux-x64-${tag}.tar.gz\`), and run \`./yswords\`. Requires GTK3 (\`libgtk-3-0\`) installed on the host." \
              || true
          fi
          gh release upload "$tag" "$PKG" --clobber
