name: seeksparks
description: "SeekSparks — a desktop/tablet-first bilingual Bible exegesis tool with structured original-language search, forked from YsWords."
publish_to: 'none'
version: 1.6.124

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  provider: ^6.1.1
  scroll_to_index: ^3.0.1
  scrollable_positioned_list: ^0.3.8
  shared_preferences: ^2.5.3
  cupertino_icons: ^1.0.2
  # 2026-08-08 (v1.6.62 — one worldwide build): firebase_core,
  # firebase_auth, cloud_firestore, firebase_database and
  # google_sign_in were removed with cross-device sync. They are the
  # reason boot had to await a `*.googleapis.com` round trip, which is
  # unreachable from mainland China, which is why a separate
  # CHINA_MODE build existed at all. One build now serves everyone and
  # the export/import card in Settings is the migration path.
  #
  # Do not re-add a Firebase package to get one small feature back:
  # `Firebase.initializeApp()` is a network call on every boot for
  # every reader, not just the ones using the feature.
  #
  # Used by AiSearchService and ErrorReporter.
  http: ^1.2.2
  # 2026-05-21 (v1.2.69): native notifications on iOS / Android /
  # macOS. Web continues to use the browser Notification API via
  # notification_service_web.dart. Plugin handles UNUserNotification
  # permission flow on Apple platforms and POST_NOTIFICATIONS on
  # Android 13+.
  flutter_local_notifications: ^19.0.0
  # 2026-08-08 (v1.6.62): google_fonts removed. It fetched every
  # non-bundled face from fonts.gstatic.com on first use, so the font
  # picker offered a dozen options that were dead for exactly the
  # readers this release is for. The catalogue in
  # lib/utils/font_catalog.dart is now the bundled faces plus the
  # system stack, and `migrateLegacyFontKey` retires a saved key.
  # Adding a face means adding an asset under `fonts:` below.
  # 2026-05-24 (v1.3.19): audioplayers removed with the 朗读 feature.
  # 2026-05-24 (v1.3.0): notification scheduler. flutter_local_notifications
  # requires `tz.TZDateTime` for `zonedSchedule`. flutter_timezone gets the
  # device's IANA timezone (e.g. "Australia/Melbourne") at startup so
  # tz.local resolves correctly — without this tz.local defaults to UTC
  # and a notification scheduled at "09:00 local" fires at 09:00 UTC.
  timezone: ^0.10.0
  # 2026-07-20: ^4.0.0 → ^5.1.0. v4.1.1's flutter_timezone_web.dart had
  # an invalid js-interop runtime cast that failed the wasm dry-run and
  # blocked `flutter build web --wasm` (skwasm renderer). The plugin
  # never actually runs on web (notification_scheduler.dart early-
  # returns on kIsWeb) — it only needed to *compile* cleanly to wasm.
  flutter_timezone: ^5.1.0
  # 2026-05-24 (v1.2.97): web favicon swap. AppIconServiceWeb uses
  # the modern package:web DOM bindings (not dart:html) to mutate
  # <link rel="icon"> when the user changes primaryColor. Already
  # pulled transitively by Flutter web, but listed explicitly so
  # the analyzer's `depend_on_referenced_packages` lint stops
  # complaining about a direct import without a direct dep.
  web: ^1.0.0
  # 2026-05-24 (v1.3.19): flutter_tts removed with the 朗读 feature.
  # path_provider + crypto were part of its audio cache and were kept on
  # the theory that a second consumer would turn up; task #281 found none
  # in lib/ or test/ fifteen months on, so they went too.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/kjv.json
    - assets/leb.json
    - assets/cuvs-yhwh.json
    - assets/cuvs-yhwh-tr.json
    - assets/biblexg-v2.json
    - assets/biblexg-v2-tr.json
    - assets/nasb.json
    - assets/bsb.json
    - assets/kjvs.json
    - assets/cuvs-plus.json
    - assets/lxxwh.json
    # NIV (Biblica/Zondervan) removed in 2026-05 — its complete text
    # cannot be redistributed without a publisher licence.
    # CUV, CUV-tr, CNV, CNV-tr, biblexg (LJK1), biblexg-tr removed
    # 2026-08 (ported from YsWords v1.4.0) — deleted outright,
    # superseded by cuvs-yhwh / biblexg-v2 (see
    # lib/constants/bible_versions.dart).
    - assets/web-ot-paragraphs.json
    - assets/app_icon.png
    - assets/loading.png
    - assets/fonts/
    - assets/maps/
    # 420px copies of the 55 plates above, for grids and filmstrips.
    # Regenerate after adding a plate: tools/gen_map_thumbs.sh
    - assets/maps/thumbs/
    - assets/maps_index.json
    # Where the plates came from, as against where their bytes load
    # (task #300). Regenerate with tools/annotate_map_provenance.py.
    - assets/maps_provenance.json
    - assets/cross_references.json
    - assets/section_titles.json
    - assets/book_introductions.json
    - assets/gospel_synopsis.json
    - assets/ot_synopsis.json
    - assets/daily_verses.json
    - assets/bible_evidence.json
    # Thayer's (1889) in English + Hitchcock's names (1869). Both were
    # committed months before this line existed, so neither was in the
    # bundle and neither could be read at runtime.
    - assets/thayer.json
    - assets/bible_names.json
    # The gazetteer, and the base map drawn under it. Same story as the
    # two above: `bible_places.json` shipped in the repo and never in
    # the bundle, so nothing could read it. `bible_geo.json` is Natural
    # Earth coastlines, lakes and rivers — public domain.
    - assets/bible_places.json
    - assets/bible_geo.json
    # Reader-to-original verse map. assets/originals is numbered in the
    # Masoretic / critical-text tradition and every edition we ship is
    # numbered in the English one, so joining them on the reader's own
    # key handed 1,823 references another verse's Hebrew.
    - assets/versification.json
    - assets/strongs/
    - assets/originals/
    - assets/tagged/cuvs-yhwh/
    - assets/tagged/bsb/
    - assets/tagged/kjvs/
    - assets/tagged/cuvs-plus/
    - assets/tagged/lxxwh/
    - assets/greek_stats/
    - assets/greek_stats/w/
    - assets/concordance/
    - assets/concordance/t/
    - assets/concordance/v/
    # Forms index (bwh10q), derived from assets/originals. `l/` is 151
    # shards fetched one at a time; nothing here loads at startup.
    - assets/forms/
    - assets/forms/l/
    - assets/sermons/index.json
    - assets/sermons/refs.json
    - assets/family_tree.json
    - assets/bible_timeline.json
    - assets/hebrew_kings.json
    - assets/sermons/en/
    - assets/sermons/zh-CN/
    - assets/sermons/zh-TW/
    # 2026-05-24 (v1.2.97): themed app-icon PNGs. Used by Dart side
    # to swap the macOS Dock icon at runtime (rootBundle.load → bytes
    # → MethodChannel → NSImage(data:) → NSApplication.applicationIconImage).
    # iOS / Android / Web use platform-native paths (loose PNGs at
    # ios/Runner/, mipmap-*/ic_launcher_<v>.png, web/icons/Icon-<V>-*.png).
    - assets/themed_icons/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-VariableFont_wdth,wght.ttf
    # 2026-05-24 (v1.3.31): bundled Noto Sans CJK SC subset covering
    # every CJK character used anywhere in the app — Bible text
    # (CUVS-YHWH, CNV, CUV, BIBLEXG variants), section titles, book
    # introductions, Strong's lexicons, sermons, family-tree names,
    # songs, evidence, and UI strings. Subsetted with pyftsubset from
    # the official Noto Sans CJK SC Regular OTF (SIL OFL, freely
    # redistributable). Source: https://github.com/notofonts/noto-cjk
    #
    # WHY: Flutter web's CanvasKit renderer ONLY uses fonts registered
    # in its Skia font registry. The `kCjkFontFallback` chain in
    # `lib/utils/font_catalog.dart` lists CSS font names (PingFang SC,
    # Microsoft YaHei, …) that CanvasKit cannot resolve unless those
    # fonts are physically loaded. Without a bundled CJK font, rare
    # characters like `赒` (Acts 10:2 in CUVS-YHWH), `䍁`, and the
    # Ext-B char `𨱔` rendered as "X" tofu glyphs because the bundled
    # Roboto has no CJK coverage. This bundled subset is now the ONLY
    # CJK face the web build can resolve — v1.6.62 removed
    # google_fonts, so nothing is downloaded at runtime. If this asset
    # goes missing the failure is silent and total: CanvasKit renders
    # nothing rather than tofu, so Chinese verses come up BLANK.
    #
    # The subset is scanned out of `assets/**` + `lib/**` and gives a
    # ~2.8 MB OTF (down from the 16 MB full Noto Sans CJK SC).
    # Regenerate with `python3 tools/build_font_subsets.py`, which
    # builds this file and the three below in one pass.
    #
    # 2026-08-08 (v1.6.73): this file grew by 423 code points. The
    # previous generator (tools/build_cjk_font_subset.sh, removed)
    # scanned /Users/pliu0036/Documents/yswords — the fork PARENT — so
    # the Chinese lexicon glosses that are this app's differentiator
    # (assets/strongs/thayer_zh.json, bdb_zh.json, the zh-TW sermons)
    # had never been in the bundle at all.
    #
    # The family name is `NotoSansSC-Sub` — registered first in
    # `kCjkFontFallback` so CanvasKit consults it before falling
    # through to the CSS-only system-font names (which are still kept
    # as further fallbacks for native iOS / macOS / Android where the
    # OS fonts ARE accessible to Flutter).
    - family: NotoSansSC-Sub
      fonts:
        - asset: assets/fonts/NotoSansSC-Sub.otf

    # 2026-08-08 (v1.6.73 — the last Google dependency). Same failure
    # mode as the CJK face above, but reached by a different road: when
    # a code point is covered by NO registered font, the Flutter ENGINE
    # (not this app's Dart) downloads a Noto face from
    # `fontFallbackBaseUrl`, which defaults to fonts.gstatic.com. That
    # host is unreachable from mainland China, and CanvasKit draws a
    # missing font as ABSENT TEXT, not tofu — so a Hebrew word study
    # came up silently blank there. Removing google_fonts in v1.6.62
    # did not touch this, because it is below the framework.
    #
    # Measured on dev v1.6.62: one Hebrew word study pulled
    # notosanshebrew, notosans, notosanssymbols and notosanssymbols2.
    # Bundled Roboto has 922 code points — Latin, Cyrillic and
    # *monotonic* Greek only — so the gaps were the whole Hebrew block,
    # the whole of Greek Extended (every accented word in the Greek NT
    # and the LXX), the Semitic transliteration diacritics, and a
    # handful of load-bearing UI symbols.
    #
    # These three are subset BY RANGE, not by the characters today's
    # assets happen to contain, because Hebrew and Greek are also
    # INPUT: a reader can type ἀγάπη or אהב into the command line.
    # NotoSansExt-Sub carries only what Roboto lacks, so chain order
    # cannot change how any Latin or monotonic Greek renders today.
    #
    # All three go AFTER the OS font names in `kCjkFontFallback` and in
    # main.dart's global `fontFamilyFallback`: on native the system
    # faces still win and nothing changes, and only CanvasKit — where
    # those CSS names are unresolvable — reaches these.
    - family: NotoSansHebrew-Sub
      fonts:
        - asset: assets/fonts/NotoSansHebrew-Sub.ttf
    - family: NotoSansExt-Sub
      fonts:
        - asset: assets/fonts/NotoSansExt-Sub.ttf
    # Text-presentation glyphs that carry meaning and that no other
    # bundled face has: □ stands in for a character lost from Judges
    # 13:7 in assets/cuvs-plus.json, ✶ is how the command line's help
    # draws the wildcard, ▶ ◀ are the phrasing pane's indent
    # instructions, ✓ is the family tree's source column. Decorative
    # emoji are deliberately NOT bundled — a monochrome symbol face
    # would replace the colour glyphs iOS and macOS already draw.
    - family: NotoSansSymbols2-Sub
      fonts:
        - asset: assets/fonts/NotoSansSymbols2-Sub.ttf

    # Microsoft YaHei was previously bundled here. It is a proprietary
    # Microsoft font (licence forbids redistribution), so we removed it
    # in 2026-05. Chinese readers get NotoSansSC-Sub above on web, and
    # the OS-installed PingFang SC / SimSun on native.

# Note:
# For Flutter Web, the browser tab icon (favicon) is located at:
# web/favicon.png
# You may need to manually replace or symlink it using:
# ln -sf ../assets/app_icon.png web/favicon.png

flutter_icons:
  image_path: "assets/app_icon.png"
  # 2026-08-06: the master PNG carries an alpha channel (it is rendered
  # from SVG), and the App Store rejects icons with one. Flatten it for
  # iOS only — every other platform is happy either way.
  remove_alpha_ios: true
  android:
    generate: true
  ios:
    generate: true
  macos:
    generate: true
  windows:
    generate: true
  linux:
    generate: true
  web:
    generate: true
    image_path: "assets/app_icon.png"
